name: Auto Update LoL ARAM Augment Data

on:
  schedule:
    # 매주 수요일 18:00 KST (UTC 09:00) 자동 실행
    - cron: "0 9 * * 3"
  workflow_dispatch: # GitHub Actions 탭에서 수동 즉시 실행 허용

permissions:
  contents: write # data.json 자동 커밋·푸시 권한

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 최신 패치 챔피언 및 증강 데이터 수집
        env:
          ARAM_STATS_API_URL: ${{ secrets.ARAM_STATS_API_URL }}
        run: python update_data.py

      - name: 변경된 data.json 자동 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data.json; then
            echo "변경된 데이터가 없습니다."
          else
            git add data.json
            git commit -m "chore: update ARAM augment & champion data ($(date +'%Y-%m-%d'))"
            git push
          fi
